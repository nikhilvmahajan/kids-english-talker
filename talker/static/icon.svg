<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed background, so Android can mask the icon to any shape; the face stays in the safe centre. -->
  <rect width="512" height="512" fill="#fff1d6"/>
  <g transform="translate(256 278)">
    <!-- ears -->
    <path d="M-150 -40 L-120 -175 L-35 -95 Z" fill="#f39a3d"/>
    <path d="M-128 -62 L-112 -140 L-62 -95 Z" fill="#f7a8b8"/>
    <path d="M150 -40 L120 -175 L35 -95 Z" fill="#f39a3d"/>
    <path d="M128 -62 L112 -140 L62 -95 Z" fill="#f7a8b8"/>
    <!-- head -->
    <ellipse cx="0" cy="0" rx="160" ry="134" fill="#f39a3d"/>
    <path d="M0 -122 l-14 38 M0 -122 l14 38 M0 -122 v44" stroke="#d97a1f" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="0" cy="58" rx="84" ry="56" fill="#ffe2bf"/>
    <!-- happy eyes -->
    <path d="M-92 -4 Q-66 -38 -40 -4" fill="none" stroke="#2b1d10" stroke-width="11" stroke-linecap="round"/>
    <path d="M40 -4 Q66 -38 92 -4" fill="none" stroke="#2b1d10" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="-96" cy="52" rx="22" ry="12" fill="#f7a8b8"/>
    <ellipse cx="96" cy="52" rx="22" ry="12" fill="#f7a8b8"/>
    <!-- nose and smile -->
    <path d="M-15 38 L15 38 L0 54 Z" fill="#e5707f"/>
    <path d="M0 54 Q0 72 -20 76 M0 54 Q0 72 20 76" fill="none" stroke="#2b1d10" stroke-width="6" stroke-linecap="round"/>
    <!-- whiskers -->
    <g stroke="#2b1d10" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <path d="M-58 50 L-140 36"/><path d="M-58 62 L-142 70"/><path d="M58 50 L140 36"/><path d="M58 62 L142 70"/>
    </g>
  </g>
</svg>
